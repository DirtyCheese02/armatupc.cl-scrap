name: ScrapDB Daily

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

concurrency:
  group: scrapdb-daily
  cancel-in-progress: false

jobs:
  run-scrapers:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Install xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Debug Chrome install
        run: |
          echo "chrome-path output: ${{ steps.setup-chrome.outputs.chrome-path }}"
          if [ -n "${{ steps.setup-chrome.outputs.chrome-path }}" ]; then
            ls -la "${{ steps.setup-chrome.outputs.chrome-path }}" || true
            "${{ steps.setup-chrome.outputs.chrome-path }}" --version || true
          fi
          which google-chrome || true
          google-chrome --version || true

      - name: Run daily ScrapDB pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SCRAP_HEADLESS: "1"
          SCRAP_USE_XVFB: "1"
          SCRAPER_RETRY_ON_EMPTY: "1"
          SCRAPER_RETRY_HEADFUL_ON_FAIL: "1"
          SCRAPER_HEADFUL: "Scrap_MyBox.py,Scrap_NotebooksYa.py,Scrap_TruluStore.py,Scrap_Alltec.py,Scrap_CTMan.py"
          SCRAPER_REQUIRE_NON_EMPTY: "Scrap_Centrale.py,Scrap_CentralGamer.py,Scrap_ETChile.py,Scrap_NotebooksYa.py,Scrap_MyShop.py,Scrap_SandosStore.py,Scrap_MyBox.py,Scrap_NiceOne.py,Scrap_TecnoMas.py,Scrap_TruluStore.py,Scrap_DazbogStore.py,Scrap_TecnoMaster.py,Scrap_Alltec.py,Scrap_CTMan.py,Scrap_NotebookStore.py,Scrap_EYLStore.py,Scrap_InfoSep.py,Scrap_InvasionGamer.py"
          BROWSER_FALLBACK_COLLECTOR_CONCURRENCY: "2"
          BROWSER_FALLBACK_SCRAPER_CONCURRENCY: "2"
          SPHINX_REQUEST_DELAY_SECONDS: "1.0"
          SCRAP_BROWSER_START_TIMEOUT: "90"
          CHROME_BINARY_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          SCRAPER_TIMEOUT_MINUTES: "90"
          MATCH_TIMEOUT_MINUTES: "60"
        run: python ScrapDB/run_all_scrapers.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scrapdb-logs-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ScrapDB/RunLogs/**
            ScrapDB/unmatched_log.txt
