name: ScrapDB Daily

on:
  workflow_dispatch:
  schedule:
    # 09:30 America/Santiago in standard and daylight-saving time. The
    # watchdog selects the matching UTC schedule from Chile's current offset.
    # It must not compare the actual minute: scheduled Actions commonly start
    # late, sometimes by close to an hour.
    - cron: "30 12 * * *"
    - cron: "30 13 * * *"

concurrency:
  group: scrapdb-daily
  cancel-in-progress: false

env:
  REQUIRED_NON_EMPTY_SCRAPERS: "Scrap_Centrale.py,Scrap_CentralGamer.py,Scrap_ETChile.py,Scrap_NotebooksYa.py,Scrap_MyShop.py,Scrap_SandosStore.py,Scrap_MyBox.py,Scrap_NiceOne.py,Scrap_TecnoMas.py,Scrap_TruluStore.py,Scrap_DazbogStore.py,Scrap_TecnoMaster.py,Scrap_Alltec.py,Scrap_CTMan.py,Scrap_NotebookStore.py,Scrap_EYLStore.py,Scrap_InfoSep.py,Scrap_InvasionGamer.py,Scrap_CIntegral.py,Scrap_TecnoShopping.py"

jobs:
  watchdog:
    name: home-node-watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      should_run: ${{ steps.claim.outputs.claimed }}
      action: ${{ steps.status-after-wait.outputs.action || steps.status.outputs.action }}
      failed_scrapers_csv: ${{ steps.status-after-wait.outputs.failed_scrapers_csv || steps.status.outputs.failed_scrapers_csv }}
      cycle_date: ${{ steps.clock.outputs.cycle_date }}
      fencing_token: ${{ steps.claim.outputs.fencing_token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Chile watchdog time
        id: clock
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: |
          cycle_date="$(TZ=America/Santiago date +%F)"
          local_time="$(TZ=America/Santiago date +%H:%M)"
          chile_offset="$(TZ=America/Santiago date +%z)"
          echo "cycle_date=${cycle_date}" >> "$GITHUB_OUTPUT"

          case "$chile_offset" in
            -0300) expected_schedule="30 12 * * *" ;;
            -0400) expected_schedule="30 13 * * *" ;;
            *)
              echo "Unsupported America/Santiago UTC offset: ${chile_offset}" >&2
              exit 1
              ;;
          esac

          echo "Local watchdog check: time=${local_time}, offset=${chile_offset}, trigger=${TRIGGER_SCHEDULE:-manual}, expected=${expected_schedule}"
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$TRIGGER_SCHEDULE" == "$expected_schedule" ]]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: ${{ steps.clock.outputs.due == 'true' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install coordinator dependencies
        if: ${{ steps.clock.outputs.due == 'true' }}
        run: pip install "supabase==2.24.0" "python-dotenv==1.1.1"

      - name: Inspect home cycle
        if: ${{ steps.clock.outputs.due == 'true' }}
        id: status
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "action=full" >> "$GITHUB_OUTPUT"
            echo "failed_scrapers_csv=" >> "$GITHUB_OUTPUT"
          else
            python -m ScrapDB.scrape_cycle status --date "${{ steps.clock.outputs.cycle_date }}"
          fi

      - name: Wait once for an active home lease
        if: ${{ steps.status.outputs.action == 'wait' }}
        id: status-after-wait
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          sleep 1200
          python -m ScrapDB.scrape_cycle status --date "${{ steps.clock.outputs.cycle_date }}"

      - name: Claim fallback cycle
        if: ${{ steps.clock.outputs.due == 'true' && (steps.status.outputs.action == 'full' || steps.status.outputs.action == 'retry' || steps.status-after-wait.outputs.action == 'full' || steps.status-after-wait.outputs.action == 'retry') }}
        id: claim
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          expected="$(python - <<'PY'
          import json, os
          print(json.dumps([value for value in os.environ['REQUIRED_NON_EMPTY_SCRAPERS'].split(',') if value]))
          PY
          )"
          python -m ScrapDB.scrape_cycle claim \
            --date "${{ steps.clock.outputs.cycle_date }}" \
            --origin github \
            --owner "github:${{ github.run_id }}:${{ github.run_attempt }}" \
            --lease-seconds 21600 \
            --expected-scrapers "$expected"

  scrape-shards:
    name: scrape-${{ matrix.name }}
    needs: watchdog
    if: ${{ needs.watchdog.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-fast
            timeout_minutes: 120
            needs_browser: "false"
            include_scrapers: "Scrap_Centrale.py,Scrap_CentralGamer.py,Scrap_CIntegral.py,Scrap_DazbogStore.py,Scrap_ETChile.py,Scrap_MyShop.py,Scrap_SandosStore.py,Scrap_TecnoMaster.py,Scrap_TecnoShopping.py,Scrap_InvasionGamer.py"
            headful_scrapers: ""
            timeout_overrides: ""
            no_headful_retry: "Scrap_CentralGamer.py,Scrap_DazbogStore.py,Scrap_TecnoShopping.py"
          - name: html-mid
            timeout_minutes: 120
            needs_browser: "true"
            include_scrapers: "Scrap_EYLStore.py,Scrap_NotebookStore.py,Scrap_TecnoMas.py,Scrap_InfoSep.py"
            headful_scrapers: "Scrap_InfoSep.py"
            timeout_overrides: ""
            no_headful_retry: ""
          - name: browser-blocked
            timeout_minutes: 120
            needs_browser: "true"
            include_scrapers: "Scrap_Alltec.py,Scrap_CTMan.py,Scrap_MyBox.py,Scrap_NotebooksYa.py,Scrap_TruluStore.py"
            headful_scrapers: "Scrap_Alltec.py,Scrap_MyBox.py,Scrap_NotebooksYa.py,Scrap_TruluStore.py"
            timeout_overrides: ""
            no_headful_retry: "Scrap_CTMan.py"
          # Heavy legacy scrapers run independently.  A blocked store must not
          # consume the whole shard or prevent completed outputs and summaries
          # from reaching the matcher/retry workflow.
          - name: legacy-kdtec
            timeout_minutes: 120
            needs_browser: "true"
            include_scrapers: "Scrap_KDtec.py"
            headful_scrapers: ""
            timeout_overrides: ""
            no_headful_retry: ""
          - name: legacy-pcexpress
            timeout_minutes: 120
            needs_browser: "false"
            include_scrapers: "Scrap_PCExpress.py"
            headful_scrapers: ""
            timeout_overrides: ""
            no_headful_retry: "Scrap_PCExpress.py"
          - name: legacy-winpy
            timeout_minutes: 180
            needs_browser: "true"
            include_scrapers: "Scrap_Winpy.py"
            headful_scrapers: "Scrap_Winpy.py"
            timeout_overrides: "Scrap_Winpy.py=165"
            no_headful_retry: ""
          - name: legacy-niceone
            timeout_minutes: 45
            needs_browser: "false"
            include_scrapers: "Scrap_NiceOne.py"
            headful_scrapers: ""
            timeout_overrides: "Scrap_NiceOne.py=30"
            no_headful_retry: "Scrap_NiceOne.py"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Chrome
        if: ${{ matrix.needs_browser == 'true' }}
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Install xvfb
        if: ${{ matrix.needs_browser == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Debug Chrome install
        if: ${{ matrix.needs_browser == 'true' }}
        run: |
          echo "chrome-path output: ${{ steps.setup-chrome.outputs.chrome-path }}"
          if [ -n "${{ steps.setup-chrome.outputs.chrome-path }}" ]; then
            ls -la "${{ steps.setup-chrome.outputs.chrome-path }}" || true
            "${{ steps.setup-chrome.outputs.chrome-path }}" --version || true
          fi
          which google-chrome || true
          google-chrome --version || true

      - name: Clean generated outputs
        run: rm -rf ScrapDB/Outputs/*

      - name: Limit a partial fallback to failed scrapers
        env:
          MATRIX_SCRAPERS: ${{ matrix.include_scrapers }}
          WATCHDOG_ACTION: ${{ needs.watchdog.outputs.action }}
          WATCHDOG_FAILED: ${{ needs.watchdog.outputs.failed_scrapers_csv }}
        run: |
          include="$(python - <<'PY'
          import os
          matrix = [item for item in os.environ['MATRIX_SCRAPERS'].split(',') if item]
          if os.environ.get('WATCHDOG_ACTION') != 'retry':
              print(','.join(matrix))
          else:
              failed = {item.casefold() for item in os.environ.get('WATCHDOG_FAILED', '').split(',') if item}
              selected = [item for item in matrix if item.casefold() in failed]
              print(','.join(selected or ['__none__.py']))
          PY
          )"
          echo "SCRAPER_INCLUDE_EFFECTIVE=${include}" >> "$GITHUB_ENV"

      - name: Run ScrapDB scraper shard
        env:
          SCRAP_HEADLESS: "1"
          SCRAP_USE_XVFB: "1"
          SCRAPER_RETRY_ON_EMPTY: "1"
          SCRAPER_RETRY_HEADFUL_ON_FAIL: "1"
          SCRAPER_INCLUDE: ${{ env.SCRAPER_INCLUDE_EFFECTIVE }}
          SCRAPER_HEADFUL: ${{ matrix.headful_scrapers }}
          SCRAPER_REQUIRE_NON_EMPTY: ${{ env.REQUIRED_NON_EMPTY_SCRAPERS }}
          SCRAPER_TIMEOUT_OVERRIDES: ${{ matrix.timeout_overrides }}
          SCRAPER_NO_HEADFUL_RETRY: ${{ matrix.no_headful_retry }}
          RUN_MATCH_PRODUCTS: "0"
          SCRAPE_SOURCE: "daily"
          SCRAPE_CYCLE_DATE: ${{ needs.watchdog.outputs.cycle_date }}
          SCRAPE_FENCING_TOKEN: ${{ needs.watchdog.outputs.fencing_token }}
          SCRAPE_SHARD_NAME: ${{ matrix.name }}
          BROWSER_FALLBACK_COLLECTOR_CONCURRENCY: "2"
          BROWSER_FALLBACK_SCRAPER_CONCURRENCY: "2"
          # Preserve Winpy's initial partial snapshot in the daily run. Failed
          # categories are retried by the dedicated retry workflow instead of
          # holding every completed category for several hours.
          WINPY_CATEGORY_RETRY_PASSES: "0"
          SPHINX_REQUEST_DELAY_SECONDS: "1.0"
          SCRAP_BROWSER_START_TIMEOUT: "90"
          CHROME_BINARY_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          SCRAPER_TIMEOUT_MINUTES: "90"
          MATCH_TIMEOUT_MINUTES: "60"
        run: python ScrapDB/run_all_scrapers.py

      - name: Upload shard outputs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scrapdb-outputs-${{ matrix.name }}
          if-no-files-found: warn
          retention-days: 14
          path: ScrapDB/Outputs/**

      - name: Upload shard logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scrapdb-logs-${{ matrix.name }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: ScrapDB/RunLogs/**

  match-products:
    name: match-products
    runs-on: ubuntu-latest
    needs: [watchdog, scrape-shards]
    if: ${{ always() && needs.watchdog.outputs.should_run == 'true' }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Clean generated outputs
        run: rm -rf ScrapDB/Outputs/*

      - name: Download shard outputs
        uses: actions/download-artifact@v6
        with:
          pattern: scrapdb-outputs-*
          merge-multiple: true
          path: _downloaded_outputs

      - name: Download shard logs
        uses: actions/download-artifact@v6
        with:
          pattern: scrapdb-logs-*
          merge-multiple: true
          path: _downloaded_logs

      - name: Normalize downloaded outputs
        run: |
          mkdir -p ScrapDB/Outputs

          if [ -d "_downloaded_outputs/ScrapDB/Outputs" ]; then
            cp -R _downloaded_outputs/ScrapDB/Outputs/. ScrapDB/Outputs/
          fi

          shopt -s nullglob dotglob
          for item in _downloaded_outputs/*; do
            name="$(basename "$item")"
            if [ "$name" = "ScrapDB" ]; then
              continue
            fi
            if [ -d "$item" ]; then
              cp -R "$item" ScrapDB/Outputs/
            elif [ "${item##*.}" = "json" ]; then
              mkdir -p ScrapDB/Outputs/_root
              cp "$item" ScrapDB/Outputs/_root/
            fi
          done

          json_count="$(find ScrapDB/Outputs -type f -name '*.json' | wc -l | tr -d ' ')"
          echo "Downloaded JSON count: ${json_count}"
          find ScrapDB/Outputs -mindepth 1 -maxdepth 2 | head -100

          if [ "$json_count" -eq 0 ]; then
            echo "::error::No JSON outputs found after downloading shard artifacts."
            exit 1
          fi

      - name: Build retry manifest and prune failed outputs
        id: retry-manifest
        run: |
          mkdir -p ScrapDB/RunLogs/retry-manifest
          python ScrapDB/scraper_retry_manifest.py build \
            --logs-root _downloaded_logs \
            --outputs-root ScrapDB/Outputs \
            --manifest ScrapDB/RunLogs/retry-manifest/retry_manifest.json \
            --prune-failed

      - name: Run product matching
        if: ${{ steps.retry-manifest.outputs.has_remaining_json == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPE_RUN_ID: ${{ steps.retry-manifest.outputs.scrape_run_id }}
          SCRAPE_SOURCE: "daily"
          SCRAPE_CYCLE_DATE: ${{ needs.watchdog.outputs.cycle_date }}
          SCRAPE_FENCING_TOKEN: ${{ needs.watchdog.outputs.fencing_token }}
          SCRAPER_SUMMARY_PATH: ScrapDB/RunLogs/retry-manifest/retry_manifest.json
        run: |
          set -o pipefail
          mkdir -p ScrapDB/RunLogs/match-products
          python ScrapDB/match_products.py 2>&1 | tee ScrapDB/RunLogs/match-products/match_products.log

      - name: Build canonical RawOffer artifact
        if: ${{ steps.retry-manifest.outputs.has_remaining_json == 'true' && vars.CANONICAL_DUAL_WRITE_ENABLED == 'true' }}
        env:
          SCRAPE_RUN_ID: ${{ steps.retry-manifest.outputs.scrape_run_id }}
          SCRAPE_CYCLE_DATE: ${{ needs.watchdog.outputs.cycle_date }}
          SCRAPE_FENCING_TOKEN: ${{ needs.watchdog.outputs.fencing_token }}
        run: |
          python -m ScrapDB.raw_offer \
            --input ScrapDB/Outputs \
            --output ScrapDB/RawRuns \
            --run-id "$SCRAPE_RUN_ID"

      - name: Publish canonical offers and compare legacy
        if: ${{ steps.retry-manifest.outputs.has_remaining_json == 'true' && vars.CANONICAL_DUAL_WRITE_ENABLED == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPE_RUN_ID: ${{ steps.retry-manifest.outputs.scrape_run_id }}
          CANONICAL_CATEGORIES: ${{ vars.CANONICAL_DUAL_WRITE_CATEGORIES || 'CPU,GPU,Motherboard,Memory,Storage,PowerSupply,Case,CPUCooler' }}
        run: |
          python -m ScrapDB.canonical_backfill \
            --apply \
            --raw-offers "ScrapDB/RawRuns/${SCRAPE_RUN_ID}.ndjson.gz" \
            --raw-offers-only \
            --dual-write \
            --categories "$CANONICAL_CATEGORIES" \
            --compare \
            --checkpoint "ScrapDB/RunLogs/canonical-${SCRAPE_RUN_ID}.checkpoint.json" \
            --comparison-report "ScrapDB/RunLogs/canonical-${SCRAPE_RUN_ID}.comparison.json"

      - name: Purge expired diagnostics and refresh daily stats
        # Legacy publication is complete before the optional canonical step.
        # Maintenance must still run when canonical comparison fails.
        if: ${{ always() && steps.retry-manifest.outputs.has_remaining_json == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPE_CYCLE_DATE: ${{ needs.watchdog.outputs.cycle_date }}
          SCRAPE_FENCING_TOKEN: ${{ needs.watchdog.outputs.fencing_token }}
          SCRAPE_RUN_ID: ${{ steps.retry-manifest.outputs.scrape_run_id }}
        run: |
          python -m ScrapDB.scrape_cycle assert \
            --date "${{ needs.watchdog.outputs.cycle_date }}" \
            --token "${{ needs.watchdog.outputs.fencing_token }}"
          python -m ScrapDB.database_maintenance post-run

      - name: Finalize fenced scrape cycle
        if: ${{ always() && needs.watchdog.outputs.should_run == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -m ScrapDB.scrape_cycle finalize-manifest \
            --date "${{ needs.watchdog.outputs.cycle_date }}" \
            --token "${{ needs.watchdog.outputs.fencing_token }}" \
            --manifest ScrapDB/RunLogs/retry-manifest/retry_manifest.json

      - name: Upload retry manifest
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scrapdb-retry-manifest-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: ScrapDB/RunLogs/retry-manifest/retry_manifest.json

      - name: Upload match logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scrapdb-match-logs-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ScrapDB/RunLogs/**
            ScrapDB/RawRuns/**
            ScrapDB/unmatched_log.txt
